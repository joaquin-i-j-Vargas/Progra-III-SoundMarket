<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundMarket | Ticket</title>
    <link rel="icon" href="../../Img/icono.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="../Css/Index.css">
    <script src="../Js/tema.js"></script> 
    <script defer src="../Js/config.js"></script> 
    <script defer src="../Js/comun.js"></script> 
    <script defer src="../Js/ticket.js"></script> 
</head>
<body>
    <header class="barra">
        <a class="marca" href="ticket.html">
            <img class="logo" src="../../Img/logo.png" alt="Logo de SoundMarket"> 
            <span class="nombre-app">Sound<span class="nombre-app-resalte">Market</span></span>
        </a>
        <nav class="enlaces">
            <button id="botonTema" class="boton-tema" type="button" aria-label="Cambiar tema">🌙</button>
            <a id="enlaceAdmin" class="boton boton-secundario" href="#">Admin</a> 
        </nav>
    </header>

    <main class="contenido">
        <section id="ticket" class="ticket"></section>
        <div class="ticket-acciones">
            <button id="descargarPdf" class="boton boton-secundario" type="button">Descargar PDF</button>
            <button id="salir" class="boton boton-principal" type="button">Salir</button>
        </div>
    </main>

    <footer class="pie">
        <p>SoundMarket · Tu música, nuestra pasión.</p>
        <p>Alumnos: Vargas Joaquin y Sanchez Axel/Melodi</p>
    </footer>
</body>
</html>
